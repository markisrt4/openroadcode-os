BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "openroadcode"
BBFILE_PATTERN_openroadcode = "^${LAYERDIR}/"
BBFILE_PRIORITY_openroadcode = "6"

LAYERDEPENDS_openroadcode = "core yocto"
LAYERSERIES_COMPAT_openroadcode = "scarthgap"
